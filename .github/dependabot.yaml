version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ":arrow_up: dep-bump"
      include: scope
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    groups:
      package-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: ":arrow_up: dep-bump"
      include: scope